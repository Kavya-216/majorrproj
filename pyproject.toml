[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecosentry"
version = "0.1.0"
description = "Eco-Sentry ARCH_6 to ARCH_8 pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=43.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
